[project]
name = "fastmcp-arcadedb-middleware"
version = "0.1.0"
description = "FastMCP Middleware for ArcadeDB: Decoupled Multi-Model Text-to-Query & Pattern 2 Inlet Bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.0",
    "langfuse>=4.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
